name: validate

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 catalog/validate.py

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: sdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-25" "build-tools;34.0.0" >/dev/null
      - name: build (sdk 25 for fire os 6-8; fails on any android.* API that Android 7.1 lacks)
        run: ./launcher/build.sh
      - name: host-side launcher tests
        run: |
          jar="$ANDROID_HOME/platforms/android-25/android.jar"
          javac -d /tmp/host -cp "$jar" launcher/src/tv/vinay/dumbtv/FocusColor.java \
            launcher/src/tv/vinay/dumbtv/Config.java launcher/tests/FocusColorTest.java
          java -cp "/tmp/host:$jar" tv.vinay.dumbtv.FocusColorTest
          javac -d /tmp/host -cp "/tmp/host:$jar" launcher/src/tv/vinay/dumbtv/Quotes.java \
            launcher/tests/QuotesTest.java
          java -cp "/tmp/host:$jar" tv.vinay.dumbtv.QuotesTest
          javac -d /tmp/host -cp "/tmp/host:$jar" launcher/src/tv/vinay/dumbtv/Walls.java \
            launcher/tests/WallsTest.java
          java -cp "/tmp/host:$jar" tv.vinay.dumbtv.WallsTest
          javac -d /tmp/host -cp "/tmp/host:$jar" launcher/src/tv/vinay/dumbtv/Recent.java \
            launcher/tests/RecentTest.java
          java -cp "/tmp/host:$jar" tv.vinay.dumbtv.RecentTest
          javac -d /tmp/host -cp "/tmp/host:$jar" launcher/src/tv/vinay/dumbtv/Marks.java \
            launcher/tests/MarksTest.java
          java -cp "/tmp/host:$jar" tv.vinay.dumbtv.MarksTest
          javac -d /tmp/host -cp "/tmp/host:$jar" launcher/src/tv/vinay/dumbtv/Ui.java \
            launcher/src/tv/vinay/dumbtv/Meter.java launcher/tests/MeterTest.java
          java -cp "/tmp/host:$jar" tv.vinay.dumbtv.MeterTest
      - name: the release apk installs on fire os 6
        run: |
          min=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging launcher/build/dumbtv-home.apk | sed -nE "s/^(minSdkVersion|sdkVersion):'([0-9]+)'.*/\2/p")
          [ "$min" = 25 ] || { echo "expected minSdkVersion 25, found $min"; exit 1; }
      - name: permissions
        run: |
          # Fire OS 6's Keeper trio is capped at sdk 27. INTERNET is the wallpaper fetch.
          dump=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions launcher/build/dumbtv-home.apk)
          echo "$dump"
          extra=$(echo "$dump" | grep uses-permission | grep -v "maxSdkVersion='27'" | grep -v 'android.permission.INTERNET' || true)
          [ -z "$extra" ] || { echo "unexpected permission on sdk 28+: $extra"; exit 1; }
          echo "$dump" | grep -q 'android.permission.INTERNET' || { echo "missing INTERNET for the wallpaper fetch"; exit 1; }
          n=$(echo "$dump" | grep -c uses-permission || true)
          [ "$n" -le 4 ] || { echo "expected at most 4 permissions, found $n"; exit 1; }

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: for f in scripts/*.sh launcher/*.sh; do bash -n "$f" || exit 1; done
      - name: offline script tests (no device)
        run: python3 -m unittest discover -s tests -v
      - name: launcher version manifest
        run: ./launcher/release-check.sh --manifest
      - name: no private addresses or hardware ids
        run: |
          if grep -rnE '\b(10|172|192)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b|\b([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}\b' \
               --exclude-dir=.git --exclude-dir=report \
               --include='*.md' --include='*.sh' --include='*.txt' --include='*.yaml' \
               --include='*.yml' --include='*.json' --include='*.py' .; then
            echo "remove the private addresses above; they belong in dumbtv.conf, not the repo"; exit 1
          fi
